name: Build Anis APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
  packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Extract Anis project
        run: |
          unzip -o AnisVoice_source.zip -d source
          ls -R source | head -100

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd source/anis_native
          gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Anis-APK
          path: source/anis_native/app/build/outputs/apk/debug/*.apk

          
